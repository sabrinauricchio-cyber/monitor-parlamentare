# Monitor Parlamentare - aggiornamento automatico.
#
# Questo file dice a GitHub: "esegui i due script (iter + feed) e salva
# i risultati nel repository". Gira sui server di GitHub: il tuo computer
# puo' restare spento.
#
# Quando gira:
#  - ogni 30 minuti, dal lunedi' al venerdi', dalle 8 alle 20 (ora italiana)
#  - una volta comunque ogni mattina alle ~7
#  - e quando premi tu il pulsante "Run workflow" su GitHub
# (Nota: gli orari programmati di GitHub non sono al secondo: possono
#  slittare di 10-30 minuti nelle ore di punta. E' normale.)

name: Aggiorna Monitor Parlamentare

on:
  schedule:
    - cron: "*/30 6-18 * * 1-5"   # ogni 30 min, lun-ven, 6-18 UTC (= 8-20 it. estiva)
    - cron: "0 5 * * *"           # rete di sicurezza: ogni mattina comunque
  workflow_dispatch:               # pulsante per il lancio manuale

permissions:
  contents: write                  # serve per salvare i file dei dati

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa la libreria necessaria
        run: pip install requests

      - name: Aggiorna gli iter (dati aperti Senato)
        run: python aggiorna_dati.py

      - name: Aggiorna i feed (Camera e Senato)
        run: python leggi_feed.py

      - name: Salva i dati aggiornati
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add dati.json feed.json
          # Salva solo se qualcosa e' cambiato, altrimenti non fa nulla.
          git diff --staged --quiet || git commit -m "Aggiornamento $(date +'%Y-%m-%d %H:%M')"
          git push
