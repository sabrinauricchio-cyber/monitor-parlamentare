# .github/workflows/pipeline.yml
#
# Esegue la pipeline di acquisizione automaticamente:
#   - ogni giorno feriale alle 15:00 ora italiana (14:00 UTC)
#   - ogni giorno feriale alle 16:00 ora italiana (15:00 UTC)
#   - ogni giorno feriale alle 17:00 ora italiana (16:00 UTC)
# (le sedute del Senato iniziano tipicamente alle 16:30)
#
# Può anche essere eseguito manualmente dalla tab "Actions" su GitHub.

name: Aggiornamento dati parlamentari

on:
  schedule:
    - cron: '0 14 * * 1-5'   # Lun-Ven ore 15:00 IT
    - cron: '0 15 * * 1-5'   # Lun-Ven ore 16:00 IT
    - cron: '0 16 * * 1-5'   # Lun-Ven ore 17:00 IT
  workflow_dispatch:           # esecuzione manuale dalla UI GitHub

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4 lxml

      - name: Esegui pipeline
        run: python src/pipeline.py

      - name: Verifica output
        run: |
          if [ ! -f public/atti_estratti.json ]; then
            echo "ERRORE: pipeline.py non ha prodotto output"
            exit 1
          fi
          python -c "
          import json
          with open('public/atti_estratti.json') as f:
              r = json.load(f)
          run = r['pipeline_run']
          print(f\"Timestamp: {run['timestamp']}\")
          print(f\"Atti estratti: {run['n_atti_estratti']}\")
          print(f\"Con segnali:   {run['n_atti_con_segnali']}\")
          print(f\"Alert:         {run['n_alert']}\")
          for fonte in run['fonti_interrogate']:
              stato = fonte.get('http_status', 'ERR')
              errore = fonte.get('errore', '')
              print(f\"Fonte {fonte['id']}: HTTP {stato} {errore}\")
          "

      - name: Pubblica su GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
          commit_message: "aggiornamento dati ${{ github.run_id }}"
